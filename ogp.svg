<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f6"/>
      <stop offset="100%" stop-color="#eee8ff"/>
    </linearGradient>

    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eb94a4"/>
      <stop offset="100%" stop-color="#9a7ab7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect
    width="1200"
    height="630"
    fill="url(#bg)"
  />

  <!-- Decoration -->
  <circle
    cx="1060"
    cy="80"
    r="240"
    fill="#f2c3cd"
    opacity="0.42"
  />

  <circle
    cx="130"
    cy="620"
    r="270"
    fill="#cfd7ff"
    opacity="0.38"
  />

  <!-- Icon -->
  <rect
    x="92"
    y="105"
    width="84"
    height="84"
    rx="24"
    fill="url(#mark)"
  />

  <text
    x="134"
    y="164"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="42"
    font-weight="700"
    fill="white"
  >
    R
  </text>

  <!-- Title -->
  <text
    x="92"
    y="305"
    font-family="Arial, sans-serif"
    font-size="82"
    font-weight="700"
    fill="#30292b"
  >
    My Raku Apps
  </text>

  <!-- Subtitle -->
  <text
    x="92"
    y="380"
    font-family="Arial, sans-serif"
    font-size="32"
    font-weight="600"
    letter-spacing="3"
    fill="#756d6e"
  >
    INDIE APP DEVELOPER
  </text>

  <!-- Message -->
  <text
    x="92"
    y="485"
    font-family="'Noto Sans JP', Arial, sans-serif"
    font-size="32"
    font-weight="600"
    fill="#9a6b76"
  >
    アプリで、毎日をちょっと"楽に"
  </text>
</svg>
